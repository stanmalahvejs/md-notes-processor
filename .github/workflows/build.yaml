name: pr

on:
  pull_request:
  push:
    branches:
      - main

env:
  SHOULD_PUSH_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  DOCKER_IMAGE: stanmalahvejs/md-notes-processor
  TEST_TAG: ${{ env.DOCKER_IMAGE }}:test

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ env.TEST_TAG }}

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Test the image
        run: |
          pytest image-tests/image-tests.py

      - if: ${{ env.SHOULD_PUSH_TAG }}
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ env.SHOULD_PUSH_TAG }}
        name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: 0.0.0

      - if: ${{ env.SHOULD_PUSH_TAG }}
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:steps.semver.outputs.next
      
      - if: ${{ env.SHOULD_PUSH_TAG }}
        name: Create Release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          tag: ${{ steps.semver.outputs.next }}
          token: ${{ github.token }}